<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Key — RBX Império</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a10;color:#f5f7ff;font-family:Arial,sans-serif}.card{width:min(92vw,500px);background:#101522;border:1px solid #263047;border-radius:20px;padding:30px;box-shadow:0 24px 80px #0008}h1{margin:0 0 7px;font-size:29px}h1 span{color:#73ff9c}.sub{color:#9ca8bd;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{margin:0;background:#171e2d;color:#b9c3d5}.tabs button.on{background:#73ff9c;color:#071009}input,button{width:100%;padding:14px;border-radius:10px;margin-top:10px}input{border:1px solid #303a50;background:#090d16;color:#fff;outline:none}button{border:0;background:#73ff9c;color:#071009;font-weight:800;cursor:pointer}.msg{min-height:22px;margin-top:14px;color:#ff8080}.result{display:none;margin-top:16px;padding:18px;border:1px solid #2e6b43;background:#0d2116;border-radius:12px;text-align:center}.key{font:700 25px monospace;margin:10px 0}.small{font-size:12px;color:#7f8ba0;margin-top:16px;line-height:1.45}</style></head><body><main class="card"><h1>RBX <span>IMPÉRIO</span></h1><div class="sub">Crie sua conta e receba sua key do launcher.</div><div class="tabs"><button id="tabReg" class="on">CRIAR CONTA</button><button id="tabLogin">ENTRAR</button></div><section id="reg"><input id="user" placeholder="Usuário"><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha (mínimo 6 caracteres)"><button id="register">CADASTRAR E PEGAR KEY</button></section><section id="login" style="display:none"><input id="loginName" placeholder="Usuário ou e-mail"><input id="loginPass" type="password" placeholder="Senha"><button id="enter">ENTRAR E VER MINHA KEY</button></section><div id="msg" class="msg"></div><div id="result" class="result"><div>Sua key:</div><div id="key" class="key"></div><button id="copy">COPIAR KEY</button></div><div class="small">Uma conta gera uma única key. Guarde seu usuário, e-mail e senha para consultar a mesma key depois.</div></main><script>
const $=x=>document.getElementById(x), msg=(t,ok=false)=>{$('msg').textContent=t;$('msg').style.color=ok?'#73ff9c':'#ff8080'},showKey=k=>{$('key').textContent=k;$('result').style.display='block'};
$('tabReg').onclick=()=>{$('reg').style.display='block';$('login').style.display='none';$('tabReg').classList.add('on');$('tabLogin').classList.remove('on');msg('');$('result').style.display='none'};$('tabLogin').onclick=()=>{$('reg').style.display='none';$('login').style.display='block';$('tabLogin').classList.add('on');$('tabReg').classList.remove('on');msg('');$('result').style.display='none'};
$('register').onclick=async()=>{msg('Criando conta...');$('result').style.display='none';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,email:$('email').value,password:$('pass').value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Erro ao cadastrar.');showKey(d.key);msg('Conta criada! Sua key está pronta.',true)}catch(e){msg(e.message)}};
$('enter').onclick=async()=>{msg('Entrando...');$('result').style.display='none';try{const r=await fetch('/api/client/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('loginName').value,password:$('loginPass').value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Erro ao entrar.');showKey(d.key);msg('Bem-vindo, '+d.username+'!',true)}catch(e){msg(e.message)}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('key').textContent);$('copy').textContent='COPIADO ✓';setTimeout(()=>$('copy').textContent='COPIAR KEY',1200)};
</script></body></html>
