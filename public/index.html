<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RBX Imperio — Keys</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#09090d;color:#eee}
.wrap{max-width:1050px;margin:0 auto;padding:32px 18px}.brand{font-size:28px;font-weight:800;margin-bottom:24px}
.card{background:#12121a;border:1px solid #292936;border-radius:16px;padding:20px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{border-radius:10px;border:1px solid #30303d;background:#0d0d13;color:#fff;padding:12px}
input{width:100%}button{cursor:pointer;font-weight:700}button.primary{background:#7c3aed;border-color:#7c3aed}
.login{max-width:420px;margin:12vh auto}.muted{color:#999}.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #282832;font-size:14px}
.key{font-family:monospace;font-weight:800;letter-spacing:1px}.ok{color:#7ee787}.bad{color:#ff7b72}
#msg{margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">RBX IMPERIO <span class="muted">• KEY MANAGER</span></div>

  <section id="login" class="card login">
    <h2>Administrador</h2>
    <input id="user" placeholder="Usuário" autocomplete="username">
    <br><br>
    <input id="pass" type="password" placeholder="Senha" autocomplete="current-password">
    <br><br>
    <button class="primary" onclick="login()">Entrar</button>
    <div id="loginMsg" class="bad"></div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <h2>Criar nova key</h2>
      <div class="row">
        <select id="days">
          <option value="1">1 dia</option>
          <option value="7">7 dias</option>
          <option value="30" selected>30 dias</option>
          <option value="90">90 dias</option>
          <option value="365">365 dias</option>
          <option value="0">Vitalícia</option>
        </select>
        <button class="primary" onclick="createKey()">+ Criar Key</button>
      </div>
      <div id="newKey" class="key"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2>Keys</h2><button onclick="loadKeys()">Atualizar</button>
      </div>
      <table>
        <thead><tr><th>Key</th><th>Validade</th><th>Status</th><th>HWID</th><th>Ação</th></tr></thead>
        <tbody id="keys"></tbody>
      </table>
    </div>
  </section>
</div>
<script>
let token=localStorage.getItem("rbx_token");
const $=id=>document.getElementById(id);
function showApp(){ $("login").classList.add("hidden"); $("app").classList.remove("hidden"); loadKeys(); }
async function login(){
  const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("user").value,password:$("pass").value})});
  const d=await r.json();
  if(!r.ok){$("loginMsg").textContent=d.error||"Erro";return}
  token=d.token;localStorage.setItem("rbx_token",token);showApp();
}
async function api(url,opt={}){
  opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};
  const r=await fetch(url,opt); if(r.status===401){localStorage.removeItem("rbx_token");location.reload()}
  return r.json();
}
async function createKey(){
  const d=await api("/api/admin/keys",{method:"POST",body:JSON.stringify({duration_days:Number($("days").value)})});
  $("newKey").textContent=d.key||d.error; loadKeys();
}
async function loadKeys(){
  const rows=await api("/api/admin/keys");
  $("keys").innerHTML=(rows||[]).map(x=>`<tr>
    <td class="key">${x.key}</td>
    <td>${x.expires_at?new Date(x.expires_at).toLocaleString("pt-BR"):"Vitalícia"}</td>
    <td class="${x.status==="active"?"ok":"bad"}">${x.status}</td>
    <td>${x.hwid?x.hwid.slice(0,16)+"…":"Não vinculada"}</td>
    <td>${x.status==="active"?`<button onclick="revoke(${x.id})">Revogar</button>`:"—"}</td>
  </tr>`).join("");
}
async function revoke(id){if(confirm("Revogar esta key?")){await api("/api/admin/keys/"+id+"/revoke",{method:"POST"});loadKeys()}}
if(token)showApp();
</script>
</body>
</html>
